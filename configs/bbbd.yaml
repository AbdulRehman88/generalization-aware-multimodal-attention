schema_version: 1
study:
  dataset_name: BBBD
  target_name: attentive_vs_distracted_experimental_condition
  condition_labels:
    ses-01: 1
    ses-02: 0
  condition_names:
    0: distracted
    1: attentive
  known_limitation: Condition is perfectly confounded with session order, repeat exposure,
    and the backward-counting dual task.
datasets:
  experiment2:
    archive_config_key: bbbd_experiment2_archive
    manifest: artifacts/revision/manifests/bbbd_experiment2_records.csv
    expected_primary_participants: 26
    expected_primary_recordings: 260
    expected_tasks: 5
  experiment3:
    archive_config_key: bbbd_experiment3_archive
    manifest: artifacts/revision/manifests/bbbd_experiment3_records.csv
    expected_primary_participants: 16
    expected_primary_recordings: 192
    expected_tasks: 6
participant_identity:
  template: '{dataset}::{subject}'
signals:
  sampling_frequency_hz: 128.0
  eeg:
    source: dataset_derivative_bdf
    convert_volts_to_microvolts: true
    channels:
    - AF7
    - Fp1
    - Fpz
    - Fp2
    - AF8
    - O1
    - POz
    - O2
  ecg:
    source: raw_tsv_gz
    bandpass_hz:
    - 0.5
    - 40.0
    filter_order: 4
    minimum_finite_fraction: 0.99
  pupil:
    source: raw_tsv_gz
    minimum_valid_value_exclusive: 0.0
    minimum_valid_fraction_per_window: 0.8
    maximum_interpolation_gap_seconds: 0.5
windowing:
  duration_seconds: 4.0
  overlap_fraction: 0.5
  edge_trim_seconds: 2.0
  use_event_end_boundary: true
features:
  welch_nperseg: 256
  eeg_bands_hz:
    delta:
    - 0.5
    - 4.0
    theta:
    - 4.0
    - 8.0
    alpha:
    - 8.0
    - 12.0
    beta:
    - 12.0
    - 30.0
    gamma_30_40:
    - 30.0
    - 40.0
  pupil_bands_hz:
    slow:
    - 0.25
    - 1.0
    fast:
    - 1.0
    - 4.0
  include_invalid_high_gamma: false
  include_four_second_frequency_domain_hrv: false
  include_legacy_pde_named_features: false
outputs:
  smoke_directory: outputs/revision/features/bbbd_smoke_v2
  full_directory: outputs/revision/features/bbbd_primary
smoke_records:
- dataset: experiment2
  subject: sub-01
  session: ses-01
  task: stim01
- dataset: experiment2
  subject: sub-01
  session: ses-02
  task: stim01
- dataset: experiment2
  subject: sub-02
  session: ses-01
  task: stim02
- dataset: experiment2
  subject: sub-02
  session: ses-02
  task: stim02
- dataset: experiment3
  subject: sub-02
  session: ses-01
  task: stim01
- dataset: experiment3
  subject: sub-02
  session: ses-02
  task: stim01
cohorts:
  direct_seven_path:
    name: participant_complete_multimodal
    registry: artifacts/revision/manifests/bbbd_multimodal_cohort_registry.csv
    selection_column: direct_complete_case
    expected_participants: 36
    expected_recordings: 392
    expected_label_counts:
      0: 196
      1: 196
    expected_dataset_participants:
      experiment2: 20
      experiment3: 16
    expected_dataset_recordings:
      experiment2: 200
      experiment3: 192
  modality_available_sensitivity:
    enabled: false
    report_separately: true
    reason: A larger modality-specific cohort cannot be directly compared with the
      locked seven-path complete-case cohort.
evaluation:
  protocol_name: bbbd_nested_participant_disjoint_v1
  scientific_target: classification of the experimentally defined attentive-versus-distracted
    viewing condition
  claim_boundary: Condition is perfectly confounded with session order, repeat exposure,
    and the backward-counting dual task.
  direct_paths:
  - EEG
  - ECG
  - Pupil
  - ECG_EEG
  - ECG_Pupil
  - EEG_Pupil
  - ECG_EEG_Pupil
  within_experiment:
    enabled: true
    protocol: nested_leave_one_participant_out
    experiments:
    - experiment2
    - experiment3
    pooled_experiment_loso_primary: false
    inner_validation_fraction: 0.2
    minimum_inner_validation_participants: 2
    split_seed: 3407
    outer_test_unit: participant
    inner_validation_unit: participant
  cross_experiment:
    enabled: true
    directions:
    - name: experiment2_to_experiment3
      source: experiment2
      target: experiment3
    - name: experiment3_to_experiment2
      source: experiment3
      target: experiment2
    target_experiment_tuning: false
    source_only_model_selection: true
    interpretation: independent-cohort cross-experiment transfer under stimulus, task-instruction,
      and cohort shift
    source_validation_fraction: 0.2
    minimum_source_validation_participants: 2
    split_seed: 3407
  training:
    window_weighting: inverse_accepted_window_count_per_recording
    recording_total_weight: 1.0
    class_resampling: false
    test_set_balancing: false
    models:
      extra_trees:
        n_estimators:
        - 500
        max_depth:
        - null
        min_samples_leaf:
        - 1
        max_features:
        - sqrt
        class_weight:
        - null
        random_state: 3407
        n_jobs: -1
      xgboost:
        n_estimators:
        - 400
        max_depth:
        - 3
        learning_rate:
        - 0.05
        subsample:
        - 0.8
        colsample_bytree:
        - 0.8
        min_child_weight:
        - 1
        objective: binary:logistic
        eval_metric: logloss
        tree_method: hist
        random_state: 3407
        n_jobs: -1
  feature_selection:
    method: mean_absolute_shap
    fit_scope: inner_training_participants_only
    selector_model: xgboost
    top_k_values:
    - 20
    - 50
    - 100
    - all
    maximum_shap_samples: 2000
    random_seed: 3407
    cleanup_scope: inner_training_participants_only
    remove_training_constant_features: true
    remove_training_duplicate_features: true
    held_out_role_access: false
  threshold_selection:
    selection_unit: recording
    probability_aggregation: arithmetic_mean_of_window_probabilities
    primary_metric: balanced_accuracy
    candidate_thresholds:
    - 0.3
    - 0.4
    - 0.5
    - 0.6
    - 0.7
    tie_breaking:
    - closest_to_0.50
    - lower_threshold
    outer_test_threshold_access: false
    cross_experiment_target_threshold_access: false
  aggregation:
    primary_decision_unit: recording
    recording_probability: arithmetic_mean_of_window_probabilities
    participant_reporting: macro_average_of_participant_specific_recording_metrics
    window_metrics: descriptive_secondary_only
    task_balancing: recording_equal
  metrics:
    primary:
    - recording_balanced_accuracy
    - recording_macro_f1
    secondary:
    - recording_accuracy
    - recording_roc_auc
    - recording_pr_auc
    - participant_macro_balanced_accuracy
    - participant_macro_f1
    descriptive:
    - window_balanced_accuracy
    - window_macro_f1
    - window_roc_auc
    - window_pr_auc
  bootstrap:
    unit: participant
    repetitions: 5000
    confidence_level: 0.95
    random_seed: 3407
    retain_all_sampled_participant_recordings: true
  selection_objective:
    unit: recording
    primary_metric: balanced_accuracy
    secondary_metric: macro_f1
    tie_breaking:
    - higher_primary_metric
    - higher_secondary_metric
    - fewer_selected_features
    - extra_trees_before_xgboost
    - lexicographic_parameter_order
  stop_rule:
    performance_chasing_prohibited: true
    outer_test_results_may_not_change_grid: true
    target_experiment_results_may_not_change_grid: true
    single_prespecified_evaluation_run: true
    execution_plan_may_change_after_performance: false
  execution:
    plan_version: 1
    random_seed: 3407
    outer_fold_parallelism: 1
    resume_completed_folds: true
    write_window_predictions: true
    write_recording_predictions: true
    write_participant_metrics: true
    deduplicate_effective_top_k: true
    fit_count_policy: Count one SHAP selector fit per path and evaluation split, one
      fit per unique model/effective-top-k candidate, and one final refit of the selected
      candidate.
    grid_revision_reason: The grid was compacted before any outer-test or target-experiment
      performance was observed. The revision removes redundant hyperparameter combinations
      and top-k values that collapse to identical feature sets for low-dimensional
      paths.
